[project]
name = "yt-downloader-gui"
version = "1.0.0"
description = "Tkinter GUI for downloading videos and audio with yt-dlp"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.9.0",
    "yt-dlp>=2026.8.19",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.0",
]

[tool.uv]
package = false
